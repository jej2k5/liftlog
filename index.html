<body>
  <main class="app">
    <header class="topbar">
      <div class="logo"><div class="brandicon" aria-hidden="true">LL</div><div><div class="brandtitle">LIFT LOG</div><div class="brandcaption">5-week strength block</div></div></div>
      <button class="roundbtn" type="button" data-action="theme" aria-label="Toggle light and dark theme" title="Toggle theme"><svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>
    <section id="overview" class="screen active" aria-label="Overview"></section>
    <section id="workout" class="screen" aria-label="Workout"></section>
    <section id="progress" class="screen" aria-label="Progress"></section>
    <section id="settings" class="screen" aria-label="Settings"></section>
    <div class="footer">Private by default · Your workout data stays in this browser</div>
  </main>
  <nav class="bottomnav" aria-label="Primary navigation"><div class="bottomnavinner">
    <button class="navbtn active" data-nav="overview" type="button" aria-label="Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg><span>Home</span></button>
    <button class="navbtn" data-nav="workout" type="button" aria-label="Workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 9v6m4-9v12m12-12v12m4-9v6M6 12h12"/></svg><span>Workout</span></button>
    <button class="navbtn" data-nav="progress" type="button" aria-label="Progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 19h18M5 16l5-5 4 3 5-8"/><path d="M16 6h3v3"/></svg><span>Progress</span></button>
    <button class="navbtn" data-nav="settings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span>Settings</span></button>
  </div></nav>
  <div class="timerbar" id="timerbar" role="timer" aria-live="off"><span>Rest timer</span><b id="timertext">3:00</b><button data-action="timer-stop" type="button">Stop</button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importInput" type="file" accept=".json,application/json" hidden>
  <script>
  (() => {
    'use strict';
    const VERSION=1, STORE='liftlog-fiveweek-v1';
    const days=[{short:'MON',title:'Bench strength',detail:'Bench + upper back',label:'Monday'},{short:'TUE',title:'Deadlift strength',detail:'Hinge + lower body',label:'Tuesday'},{short:'THU',title:'Overhead press',detail:'Shoulders + paused bench',label:'Thursday'},{short:'SAT',title:'Squat + bench',detail:'Bench volume + legs',label:'Saturday'}];
    const weekNames=['5s · Build','3s · Strength','5/3/1 · Heavy','Deload and recover','Next cycle · 5s'];
    const sets=(weight,reps,n,labels)=>Array.from({length:n},(_,i)=>({weight,reps,label:labels?.[i]||`Set ${i+1}`}));
    const ex=(id,name,values,note='',optional=false)=>({id,name,sets:values,note,optional});
    const DEFAULT_CONFIG={percent:85,benchTM:140,advanceNextCycle:true,e1rm:{bench:190,squat:295,deadlift:320,ohp:140}};
    const round5=(value)=>Math.max(0,Math.round(value/5)*5);
    function cfg(){const p=state.config||{};return {...DEFAULT_CONFIG,...p,e1rm:{...DEFAULT_CONFIG.e1rm,...(p.e1rm||{})}};}
    function trainingMax(lift,w){
      const c=cfg(),e1rm=Number(c.e1rm[lift])||0;
      const baseline=lift==='bench' ? Number(c.benchTM)||140 : round5(e1rm*(Number(c.percent)||85)/100);
      // Week 5 is the beginning of the following cycle, if the previous one was completed successfully.
      return Math.max(0,round5(baseline+(w===5&&c.advanceNextCycle?(lift==='squat'||lift==='deadlift'?10:5):0)));
    }
    const schemes=[[[65,5],[75,5],[85,5]],[[70,3],[80,3],[90,3]],[[75,5],[85,3],[95,1]],[[40,5],[50,5],[60,5]]];
    function main531(lift,w){
      const scheme=schemes[w===5?0:w-1],tm=trainingMax(lift,w);
      return scheme.map(([pct,reps],i)=>({weight:round5(tm*pct/100),reps,label:`${pct}% · ${reps}${i===2&&w!==4?'+':''}`}));
    }
    function mk(w){
      const i=w-1;
      const deload=w===4;
      const bench=main531('bench',w),deadlift=main531('deadlift',w),ohp=main531('ohp',w),squat=main531('squat',w);
      const volWeights=[115,120,125,100,120], pauseWeights=[95,100,105,85,95], closeWeights=[95,100,100,0,100];
      return [
        [ex('bench-heavy','Bench press · 5/3/1',bench,'Main lift: percentages are based on your current, conservative bench training max. The + is optional clean reps, never failure.'),...(deload?[]:[ex('row','Chest-supported row',sets('',8,3),'8–10 controlled reps; enter dumbbell or machine load.'),ex('close','Close-grip bench',sets(closeWeights[i],w===3?5:6,2),'Stop short of failure; moderate grip, controlled bar path.')])],
        [ex('deadlift','Deadlift · 5/3/1',deadlift,'Stop the final set when bar speed or technique deteriorates. No grinders.'),...(deload?[]:[ex('split','Split squat',sets('',8,2),'8 controlled reps per leg.'),ex('core','Dead bug',sets('',8,2),'Core stability, 8 reps per side.')])],
        [ex('ohp','Overhead press · 5/3/1',ohp,'Keep overhead press and deadlift on separate days; clean overhead reps, no grind.'),...(deload?[]:[ex('pause','Paused bench press',sets(pauseWeights[i],3,2),'One-second pause at chest; accelerate through midpoint with stable bar path.'),ex('pulldown','Lat pulldown',sets('',8,3),'8–10 controlled repetitions.')])],
        [ex('bench-volume','Bench press · volume',sets(volWeights[i],w===3?4:5,deload?2:3),'Bench priority supplemental work. Smooth, unassisted sets; reduce the load if RPE exceeds 8.'),ex('squat','Back squat · 5/3/1',squat,'After bench volume, follow the squat percentage sets. Reduce the bench volume if it compromises squat technique.'),...(deload?[]:[ex('pressdown','Triceps pressdown',sets('',10,2),'10–12 reps without reaching failure.')])]
      ];
    }
    let plan=[];
    let memoryOnly=false;
    const blank=()=>({version:VERSION, sets:{}, sessions:{}, config:JSON.parse(JSON.stringify(DEFAULT_CONFIG)), selectedWeek:1,selectedDay:0, screen:'overview', theme:'dark'});
    function load(){try{const raw=localStorage.getItem(STORE);if(!raw)return blank();const p=JSON.parse(raw);if(!p || typeof p!=='object'|| p.version!==VERSION) return blank();return {...blank(),...p,sets:p.sets||{},sessions:p.sessions||{}}}catch(e){memoryOnly=true;return blank()}}
    let state=load();
    plan=Array.from({length:5},(_,i)=>mk(i+1));
    function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){memoryOnly=true;} }
    const id=(week,day,exid,index)=>`w${week}_d${day}_${exid}_${index}`;
    const sid=(week,day)=>`w${week}_d${day}`;
    const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const number=(n)=>typeof n==='number'&&Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:1}):'—';
    const getSet=(w,d,e,j)=>state.sets[id(w,d,e.id,j)]||{};
    const session=(w,d)=>state.sessions[sid(w,d)]||{};
    const doneSets=(w,d)=>plan[w-1][d].reduce((a,e)=>a+e.sets.filter((_,j)=>getSet(w,d,e,j).done).length,0);
    const totalSets=(w,d)=>plan[w-1][d].reduce((a,e)=>a+e.sets.length,0);
    const sessionDone=(w,d)=>!!session(w,d).finished;
    const weekDone=(w)=>days.filter((_,d)=>sessionDone(w,d)).length;
    function nextWorkout(){for(let w=1;w<=5;w++)for(let d=0;d<4;d++)if(!sessionDone(w,d))return {w,d};return {w:5,d:3};}
    let toastTimer;
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
    const weekChips=(selected)=>`<div class="weeklist" role="group" aria-label="Select training week">${Array.from({length:5},(_,i)=>`<button class="weekchip ${selected===i+1?'active':''}" data-week="${i+1}" type="button" aria-pressed="${selected===i+1}">W${i+1}<span class="complete">${weekDone(i+1)}/4</span></button>`).join('')}</div>`;
    function overview(){
      const n=nextWorkout(),completed=Array.from({length:5},(_,i)=>weekDone(i+1)).reduce((a,b)=>a+b,0),totalSetsDone=Object.values(state.sets).filter(x=>x.done).length;
      document.getElementById('overview').innerHTML=`
       <div class="intro"><div><div class="eyebrow">Your strength, one rep at a time</div><h1>Stronger every week.</h1><p>5/3/1 main lifts, Mansour-inspired accessories, and bench-specific midpoint practice. Weights adjust to your training maxes.</p></div></div>
       <div class="card hero"><div class="eyebrow">Up next · Week ${n.w}</div><h2>${days[n.d].label}<br>${days[n.d].title}</h2><p>${days[n.d].detail}. Check off every set, log the weights you actually lifted, and record your effort.</p><button class="btn" data-open="${n.w},${n.d}" type="button">Open workout <span aria-hidden="true">↗</span></button></div>
       <div class="statgrid"><div class="stat"><strong>${completed}<span> / 20</span></strong><span>Sessions finished</span></div><div class="stat"><strong>${totalSetsDone}</strong><span>Sets logged</span></div><div class="stat"><strong>${Math.round(completed/20*100)}%</strong><span>Block complete</span></div></div>
       <div class="card"><div class="row"><h3>Five-week progress</h3><span class="tiny muted">${completed}/20 sessions</span></div><div style="margin:14px 0 16px" class="progressbar"><i style="width:${completed/20*100}%"></i></div>${weekChips(state.selectedWeek)}<div class="sectionhead"><h3>Week ${state.selectedWeek} · ${weekNames[state.selectedWeek-1]}</h3><button class="btn secondary smallbtn" data-nav="workout" type="button">View week</button></div><div class="sessionlist">${days.map((d,i)=>`<div class="sessionitem"><div><b>${d.label} · ${d.title}</b><br><span>${sessionDone(state.selectedWeek,i)?'Completed':'Ready to log'} · ${doneSets(state.selectedWeek,i)}/${totalSets(state.selectedWeek,i)} sets</span></div><button class="btn smallbtn ${sessionDone(state.selectedWeek,i)?'secondary':''}" data-open="${state.selectedWeek},${i}" type="button">${sessionDone(state.selectedWeek,i)?'Review':'Open'}</button></div>`).join('')}</div></div>
       <div class="sectionhead"><h2>Current training maxes</h2><span class="tag">Editable in Settings</span></div><div class="baselinegrid">${[['BENCH','bench'],['SQUAT','squat'],['DEADLIFT','deadlift'],['OVERHEAD PRESS','ohp']].map(([label,lift])=>`<div class="baseline"><label>${label}</label><b>${trainingMax(lift,1)} lb</b><em>${lift==='bench'?'Safety override · estimated 1RM '+cfg().e1rm.bench:'Estimated 1RM '+cfg().e1rm[lift]+' · '+cfg().percent+'% TM'}</em></div>`).join('')}</div>
       <div class="card" style="margin-top:14px"><div class="row"><h3>Training rules</h3><span class="tag">RPE 7–8</span></div><p class="info" style="margin-top:10px">Keep most sets 2–3 reps short of failure, rest 3–5 minutes for main lifts, and repeat or reduce weight if a rep needs help or technique breaks down. Progress is earned, not forced.</p></div>`;
    }
    function exerciseHTML(e,w,d,n){
      const completed=e.sets.filter((_,i)=>getSet(w,d,e,i).done).length;
      return `<article class="card exercise"><header class="exhead"><div><div class="eyebrow">Exercise ${n+1}</div><h3>${escapeHTML(e.name)}</h3><div class="exsubtitle">${e.sets.length} sets · ${completed}/${e.sets.length} complete ${e.optional?'· Optional attempts':''}</div><p class="exnote">${escapeHTML(e.note)}</p></div><span class="exnum">${completed}/${e.sets.length}</span></header><table class="settable"><thead><tr><th scope="col">Set</th><th scope="col">Weight (lb)</th><th scope="col">Reps</th><th scope="col">Done</th></tr></thead><tbody>${e.sets.map((set,j)=>{
      const v=getSet(w,d,e,j),isdone=!!v.done,weight= v.weight===undefined?set.weight:v.weight,reps=v.reps===undefined?set.reps:v.reps;
      const k=id(w,d,e.id,j);return `<tr class="${isdone?'checked':''}"><td class="rowlabel">${escapeHTML(set.label)}</td><td><input class="num" aria-label="${escapeHTML(e.name)} ${escapeHTML(set.label)} weight in pounds" data-field="weight" data-key="${k}" type="number" min="0" max="2000" step="any" inputmode="decimal" value="${escapeHTML(weight)}" placeholder="–"></td><td><input class="num" aria-label="${escapeHTML(e.name)} ${escapeHTML(set.label)} completed repetitions" data-field="reps" data-key="${k}" type="number" min="0" max="100" step="1" inputmode="numeric" value="${escapeHTML(reps)}"></td><td><button type="button" class="setcheck ${isdone?'checked':''}" aria-label="${isdone?'Uncheck':'Complete'} ${escapeHTML(e.name)}, ${escapeHTML(set.label)}" aria-pressed="${isdone}" data-check="${k}">${isdone?'✓':'○'}</button></td></tr>`;
      }).join('')}</tbody></table><div class="exbottom">Tap the circle when a set is finished. Edit weight and reps to record what you actually did.</div></article>`;
    }
    function workout(){
      const w=state.selectedWeek,d=state.selectedDay,s=session(w,d),finished=!!s.finished,ds=doneSets(w,d),ts=totalSets(w,d),pct=ts?Math.round(ds/ts*100):0;
      document.getElementById('workout').innerHTML=`
      <div class="intro"><div><div class="eyebrow">Workout log</div><h1>Make every rep count.</h1><p>Choose a week and training day. Your edits save on this device.</p></div><span class="tag">Week ${w}/5</span></div>
      ${weekChips(w)}
      <div class="daystrip" role="group" aria-label="Select workout day">${days.map((day,i)=>`<button class="daytab ${d===i?'active':''}" data-day="${i}" type="button" aria-pressed="${d===i}"><span>${day.short}</span><b>${day.label.slice(0,3)}</b><span>${sessionDone(w,i)?'✓ Done':`${doneSets(w,i)} sets`}</span></button>`).join('')}</div>
      <div class="sessionhead"><div class="eyebrow">${days[d].label} · ${weekNames[w-1]}</div><div class="sessiontitle"><h2>${days[d].title}</h2><span class="tag">${ds}/${ts} sets</span></div><p class="hint">${days[d].detail}</p><div class="sessionmetrics"><div class="progressbar"><i style="width:${pct}%"></i></div><strong class="small">${pct}%</strong></div></div>
      ${w===5?'<div class="notice">Week 5 begins the next 5/3/1 cycle. Increased training maxes are conditional on finishing the previous cycle with clean, controlled reps. To repeat the original maxes instead, turn off the cycle increase in Settings. No 1RM testing is prescribed.</div>':''}
      ${plan[w-1][d].map((e,i)=>exerciseHTML(e,w,d,i)).join('')}
      <div class="card"><div class="row wrap" style="margin-bottom:15px"><h3>Rest timer</h3><div class="row wrap"><button class="btn secondary smallbtn" data-rest="120" type="button">2 min</button><button class="btn secondary smallbtn" data-rest="180" type="button">3 min</button><button class="btn secondary smallbtn" data-rest="300" type="button">5 min</button></div></div><div class="editgrid"><div><label class="formlabel" for="sessionRPE">Session RPE</label><select id="sessionRPE" class="rpeselect"><option value="">Select effort</option>${['5','6','7','7.5','8','8.5','9','10'].map(v=>`<option value="${v}" ${s.rpe===v?'selected':''}>RPE ${v}</option>`).join('')}</select></div><div><label class="formlabel" for="workoutDate">Workout date</label><input id="workoutDate" style="min-height:44px;padding:10px;width:100%" type="date" value="${escapeHTML(s.date||'')}"></div></div><div style="margin-top:14px"><label class="formlabel" for="sessionNotes">Notes</label><textarea id="sessionNotes" placeholder="Bar speed, sticking point, energy, pain, sleep, anything worth remembering…">${escapeHTML(s.notes||'')}</textarea></div><p class="hint" style="margin:12px 0">${finished?'Workout marked finished. You can still edit your log.':'Mark finished when you are done, even if you intentionally skipped some sets.'}</p><button class="btn full ${finished?'secondary':''}" data-action="finish" type="button">${finished?'✓ Finished · tap to reopen':'Finish workout'}</button></div>`;
    }
    function progress(){
      const completed=Array.from({length:5},(_,i)=>weekDone(i+1)).reduce((a,b)=>a+b,0);
      let volume=0,workingSets=0,setsLogged=0;
      const records=[];
      for(let w=1;w<=5;w++)for(let d=0;d<4;d++){
        const s=session(w,d);if(s.finished||doneSets(w,d)){records.push({w,d,s,done:doneSets(w,d),total:totalSets(w,d)});}
        plan[w-1][d].forEach(e=>e.sets.forEach((p,j)=>{const v=getSet(w,d,e,j);if(!v.done)return;setsLogged++;const wt=+(v.weight===undefined?p.weight:v.weight),reps=+(v.reps===undefined?p.reps:v.reps);if(wt>0&&reps>0){volume+=wt*reps;workingSets++;}}));
      }
      const datestr=v=>v?new Date(`${v}T12:00:00`).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Date not set';
      document.getElementById('progress').innerHTML=`<div class="intro"><div><div class="eyebrow">Progress dashboard</div><h1>Proof of the work.</h1><p>A clear view of your training, completed sessions, and logged lifting volume.</p></div></div>
        <div class="statgrid"><div class="stat"><strong>${completed}</strong><span>Workouts done</span></div><div class="stat"><strong>${setsLogged}</strong><span>Sets completed</span></div><div class="stat"><strong>${Math.round(volume/1000*10)/10}k</strong><span>Logged lb × reps</span></div></div>
        <div class="card"><div class="row"><h3>Sessions by week</h3><span class="tag">${completed}/20</span></div><div class="progressweeks">${Array.from({length:5},(_,i)=>`<div class="barcol"><b>${weekDone(i+1)}/4</b><div class="bartrack"><div class="barfill" style="height:${weekDone(i+1)*25}%"></div></div><span>W${i+1}</span></div>`).join('')}</div><p class="hint">Each bar represents finished workouts, not just checked-off sets.</p></div>
        <div class="card"><div class="row"><h3>Training history</h3><span class="tag">${records.length} logged</span></div><div class="loglist" style="margin-top:15px">${records.length?records.sort((a,b)=>b.w-a.w||b.d-a.d).map(r=>`<div class="logitem"><div><strong>W${r.w} · ${days[r.d].label}</strong><br><span>${datestr(r.s.date)} · ${r.done}/${r.total} sets · ${r.s.rpe?'RPE '+escapeHTML(r.s.rpe):'No RPE'}</span></div><button class="btn secondary smallbtn" type="button" data-open="${r.w},${r.d}">${r.s.finished?'Review':'Continue'}</button></div>`).join(''):'<div class="empty">No workout sets logged yet. Start with Week 1.</div>'}</div></div>
        <div class="card"><h3>What this measures</h3><p class="info" style="margin-top:9px">Logged volume counts completed sets with a weight and repetition value. It is not a measure of strength or an estimated 1RM. Log your actual performance, even when it differs from the plan.</p></div>`;
    }
    function settings(){document.getElementById('settings').innerHTML=`<div class="intro"><div><div class="eyebrow">Preferences and your data</div><h1>Make it yours.</h1><p>Training notes are stored locally in this browser and aren't sent to any server.</p></div></div>
     <div class="card"><h3>5/3/1 calculator</h3><p class="info" style="margin:8px 0 13px">Your supplied numbers are estimated one-rep maxes, not training maxes. Bench uses a lower safety override because your last 155 lb attempt required help on the third rep. All working weights are rounded to 5 lb.</p>
       <div class="editgrid">${[['bench','Bench'],['squat','Squat'],['deadlift','Deadlift'],['ohp','Overhead press']].map(([key,label])=>`<div><label class="formlabel" for="erm-${key}">${label} estimated 1RM</label><input id="erm-${key}" class="num" style="width:100%" type="number" inputmode="decimal" min="45" max="1200" step="5" value="${escapeHTML(cfg().e1rm[key])}"></div>`).join('')}</div>
       <div class="editgrid" style="margin-top:13px"><div><label class="formlabel" for="tm-percent">Training max percentage</label><select id="tm-percent" style="min-height:44px;width:100%;padding:8px">${[80,85,90].map(v=>`<option value="${v}" ${Number(cfg().percent)===v?'selected':''}>${v}%</option>`).join('')}</select></div><div><label class="formlabel" for="bench-tm">Bench TM safety override (lb)</label><input id="bench-tm" class="num" style="width:100%" type="number" inputmode="decimal" min="45" max="600" step="5" value="${escapeHTML(cfg().benchTM)}"></div></div>
       <div style="margin-top:14px"><label><input id="advance-next" type="checkbox" ${cfg().advanceNextCycle?'checked':''}> Add +5 lb upper / +10 lb lower to week 5 (only if earned)</label></div>
       <div class="baselinegrid" style="margin-top:14px">${[['bench','Bench'],['squat','Squat'],['deadlift','Deadlift'],['ohp','Press']].map(([key,label])=>`<div class="baseline"><label>${label} TM</label><b>${trainingMax(key,1)} lb</b></div>`).join('')}</div><p class="hint" style="margin-top:10px">Changes to maxes change planned set weights immediately, but already-entered actual weights and completed sets are retained. Export a backup before a major plan change.</p></div>
     <div class="card"><h3>Data & backups</h3><p class="info" style="margin:8px 0 17px">Export a backup before switching phones, browsers, or clearing site data. Import that JSON backup on the new device to restore all logged sets and notes.</p><div class="settingsgroup"><button class="btn secondary full" data-action="export" type="button">↓ Export backup (JSON)</button><button class="btn secondary full" data-action="csv" type="button">↓ Export log (CSV)</button><button class="btn secondary full" data-action="import" type="button">↑ Restore backup (JSON)</button><button class="btn ghost full" data-action="print" type="button">Print this view</button></div></div>
     <div class="card"><h3>Use it like an app on iPhone</h3><p class="info" style="margin-top:10px">For the best experience, host these files on a secure website (such as GitHub Pages), open that URL in Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. You can also open the standalone HTML file, but local saving may be restricted in file previews.</p><p class="info" style="margin-top:8px">When hosted over HTTPS, the included web app manifest and service worker can make the tracker installable and available offline after the first load.</p></div>
     <div class="card"><h3>Training safety</h3><p class="info" style="margin-top:9px">Bench 185 lb is a longer-term goal, not a guaranteed five-week result. The program now uses 5/3/1 main lifts with an 85% TM default and a conservative bench override. Keep working sets near RPE 7–8 or easier, avoid assisted repetitions, and consider medical clearance before maximal tests given your cardiovascular concerns. Stop for unusual chest discomfort, dizziness, or breathlessness.</p></div>
     <div class="card"><h3>Reset</h3><p class="info" style="margin:8px 0 14px">Permanently erase locally saved training logs, dates and session notes from this browser.</p><button class="btn danger full" data-action="reset" type="button">Erase local workout data</button></div>
     ${memoryOnly?'<div class="notice">Browser storage appears unavailable. Export backups frequently: changes may not survive closing this page.</div>':''}`;}
    const screens=['overview','workout','progress','settings'];
    function render(){plan=Array.from({length:5},(_,i)=>mk(i+1));document.documentElement.classList.toggle('light',state.theme==='light');overview();workout();progress();settings();screens.forEach(s=>document.getElementById(s).classList.toggle('active',state.screen===s));document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===state.screen));}
    function go(scr){if(!screens.includes(scr))return;state.screen=scr;save();render();window.scrollTo({top:0,behavior:'smooth'});}
    function mutateSession(field,value){const key=sid(state.selectedWeek,state.selectedDay);state.sessions[key]={...state.sessions[key],[field]:value};save();}
    let timerInterval=null,timerEnd=0;
    function timerUpdate(){const remain=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timertext').textContent=`${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`;if(!remain){clearInterval(timerInterval);timerInterval=null;document.getElementById('timerbar').classList.remove('show');toast('Rest complete — ready for the next set');try{navigator.vibrate?.([100,80,100])}catch(e){} }}
    function startTimer(secs){clearInterval(timerInterval);timerEnd=Date.now()+secs*1000;document.getElementById('timerbar').classList.add('show');timerUpdate();timerInterval=setInterval(timerUpdate,500);toast(`${secs/60}-minute rest started`)}
    function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
    function exportJson(){download('lift-log-backup.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup exported')}
    function exportCsv(){const table=[['week','day','exercise','set','planned_lb','planned_reps','actual_lb','actual_reps','completed','date','session_rpe','notes']];for(let w=1;w<=5;w++)for(let d=0;d<4;d++)for(const e of plan[w-1][d])for(let j=0;j<e.sets.length;j++){const p=e.sets[j],v=getSet(w,d,e,j),s=session(w,d);table.push([w,days[d].label,e.name,p.label,p.weight,p.reps,v.weight===undefined?p.weight:v.weight,v.reps===undefined?p.reps:v.reps,v.done?'yes':'no',s.date||'',s.rpe||'',s.notes||'']);}download('lift-log-sessions.csv',table.map(row=>row.map(cell=>'"'+String(cell??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
    function handleAction(type){switch(type){case'theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;case'finish':{const w=state.selectedWeek,d=state.selectedDay,key=sid(w,d);const orig=session(w,d);const finished=!orig.finished;const now=new Date();const date=orig.date||new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);state.sessions[key]={...orig,finished,date:finished?date:orig.date};save();render();toast(finished?'Workout finished ✓':'Workout reopened');break;}case'export':exportJson();break;case'csv':exportCsv();break;case'import':document.getElementById('importInput').click();break;case'print':window.print();break;case'reset':if(confirm('Erase all locally saved workout data? Export a backup first if you want to keep it.')){state=blank();save();render();toast('Workout data reset')}break;case'timer-stop':clearInterval(timerInterval);timerInterval=null;document.getElementById('timerbar').classList.remove('show');break;}}
    document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
      if(b.dataset.nav){go(b.dataset.nav);return;}
      if(b.dataset.week){state.selectedWeek=+b.dataset.week;save();render();return;}
      if(b.dataset.day){state.selectedDay=+b.dataset.day;save();render();return;}
      if(b.dataset.open){const[w,d]=b.dataset.open.split(',').map(Number);state.selectedWeek=w;state.selectedDay=d;go('workout');return;}
      if(b.dataset.check){const key=b.dataset.check;state.sets[key]={...state.sets[key],done:!state.sets[key]?.done,updatedAt:new Date().toISOString()};save();render();return;}
      if(b.dataset.rest){startTimer(+b.dataset.rest);return;}
      if(b.dataset.action)handleAction(b.dataset.action);
    });
    document.addEventListener('change',ev=>{const el=ev.target;
      if(el.dataset.field&&el.dataset.key){const value=el.value;state.sets[el.dataset.key]={...state.sets[el.dataset.key],[el.dataset.field]:value,updatedAt:new Date().toISOString()};save();return;}
      if(el.id.startsWith('erm-')){const lift=el.id.slice(4),v=Number(el.value);if(v>=45&&v<=1200){state.config={...cfg(),e1rm:{...cfg().e1rm,[lift]:v}};save();render();}return;}
      if(el.id==='tm-percent'){state.config={...cfg(),percent:Number(el.value)};save();render();return;}
      if(el.id==='bench-tm'){const v=Number(el.value);if(v>=45&&v<=600){state.config={...cfg(),benchTM:v};save();render();}return;}
      if(el.id==='advance-next'){state.config={...cfg(),advanceNextCycle:el.checked};save();render();return;}
      if(el.id==='sessionRPE'){mutateSession('rpe',el.value);return;}
      if(el.id==='workoutDate'){mutateSession('date',el.value);return;}
    });
    document.addEventListener('input',ev=>{if(ev.target.id==='sessionNotes')mutateSession('notes',ev.target.value)});
    document.getElementById('importInput').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{const txt=await f.text(),data=JSON.parse(txt);if(data.version!==VERSION||!data.sets||!data.sessions||typeof data.sets!=='object'||typeof data.sessions!=='object')throw Error('Invalid backup file');if(!confirm('Restore backup? This replaces the workout logs currently saved in this browser.'))return;state={...blank(),...data,screen:'overview',selectedWeek:Math.max(1,Math.min(5,Number(data.selectedWeek)||1)),selectedDay:Math.max(0,Math.min(3,Number(data.selectedDay)||0)),theme:data.theme==='light'?'light':'dark'};save();render();toast('Backup restored');}catch(e){alert('Could not import this backup. Check that it is a Lift Log JSON file.')}finally{ev.target.value=''}});
    // A service worker is optional; the standalone HTML works without it.
    if(location.protocol==='https:' && 'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
    render();
  })();
  </script>
</body>
</html>
